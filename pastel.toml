# Pastel project file

[project]
name = "pastel-db"
version = "1.0.0"
pastel = "2.0"          # the Pastel version this project is made for
title = "Pastel DB"       # the name in window lists, menus and installers
type = "app"

[build]
main = "src/main.pas"
mode = "objfpc"          # objfpc or delphi
defines = []

[targets]
# Platforms built by "pastel build --all". See "pastel targets" for the list.
platforms = ["linux", "windows", "android"]
